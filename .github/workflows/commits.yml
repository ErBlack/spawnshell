name: Commits

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            .github/check-commits.sh "$BASE..$HEAD"
          elif release=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$AFTER"); then
            .github/check-commits.sh "$release..$AFTER"
          else
            echo "no release tag v* found, tag the last released commit" >&2
            exit 1
          fi
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          .githooks/commit-msg "$RUNNER_TEMP/title"
