<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Every Spawnshell release and what changed in it."
    />
    <title>Changelog · Spawnshell</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="./fonts/FiraCode-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./src/styles/changelog-page.css" />
  </head>
  <body class="changelog">
    <header>
      <a class="wordmark" href="./">spawnshell</a>
    </header>
    <main>
      <h1>Changelog</h1>
      %CHANGELOG%
    </main>
    <footer class="footer">
      <a href="%RELEASES%">Releases</a>
      <a href="%REPO%">GitHub</a>
    </footer>
  </body>
</html>
