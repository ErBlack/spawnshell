[package]
name = "spawnshell-notifier"
version = "0.1.0"
edition = "2024"

[lib]
name = "notifier"

[dependencies]
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "bitflags",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[lints]
workspace = true
