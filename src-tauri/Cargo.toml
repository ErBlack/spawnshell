[package]
name = "spawnshell"
version = "0.0.2"
description = "A Quake-style drop-down terminal"
authors = ["erblack"]
license = "GPL-3.0-or-later"
edition = "2024"

[workspace]
members = ["crates/*"]

[workspace.dependencies]
config = { package = "spawnshell-config", path = "crates/config" }
protocol = { package = "spawnshell-protocol", path = "crates/protocol" }
daemon = { package = "spawnshell-daemon", path = "crates/daemon" }
cli = { package = "spawnshell-cli", path = "crates/cli" }
notifier = { package = "spawnshell-notifier", path = "crates/notifier" }
platform = { package = "spawnshell-platform", path = "crates/platform" }
client = { package = "spawnshell-client", path = "crates/client" }
entry = { package = "spawnshell-entry", path = "crates/entry" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "6"
global-hotkey = "0.8"
libc = "0.2.189"
log = "0.4.34"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"
vte = "0.15"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
naive_bytecount = "allow"
missing_errors_doc = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
client.workspace = true
config.workspace = true
entry.workspace = true
notifier.workspace = true
platform.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tauri-plugin-log = "2.10.0"
log.workspace = true
specta.workspace = true
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPanel", "NSWindow", "NSView", "NSResponder"] }
tauri-nspanel = "2.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = false

[lints]
workspace = true
